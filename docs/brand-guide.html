  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

lain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 1px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: none;\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 1px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid color-mix(in srgb, var(--color-text) 8%, transparent);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n/* — rounded frame: everything softens, small controls go pill — */\n.card, .dialog { border-radius: calc(var(--radius-lg) * 1.15); }\n.btn, .tag, .seg, .input { bor was tested at 96, 32 and 16 px on paper. A was chosen for refinement.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px;\">\n      <div style=\"display: flex; flex-direction: column; gap: 20px; padding: 28px; border-radius: 32px; background: var(--color-surface); outline: 2px solid #c67139; outline-offset: -2px;\">\n        <div style=\"display: flex; justify-content: space-between; align-items: center;\"><span style=\"font-family: var(--font-heading); font-size: 20px;\">A · Pulse-check<\u002Fspan><span style=\"font-size: 12px; padding: 3px 10px; border-radius: 999px; background: #c67139; color: #201e1d;\">Chosen<\u002Fspan><\u002Fdiv>\n        <div style=\"display: flex; align-items: flex-end; gap: 24px;\">\n          <svg width=\"96\" height=\"96\" sc-camel-view-box=\"0 0 64 64\"><circle cx=\"32\" cy=\"32\" r=\"32\" fill=\"#c67139\"><\u002Fcircle><path d=\"M11 33h9l4.5-8 7 17L52 19\" fill=\"none\" stroke=\"#f9f4ed\" stroke-width=\"5.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n          <svg width=\"32\" height=\"32\" sc-camel-view-box=\"0 0 64 64\"><circle cx=\"32\" cy=\"32\" r=\"32\" fill=\"#c67139\"><\u002Fcircle><path d=\"M11 33h9l4.5-8 7 17L52 19\" fill=\"none\" stroke=\"#f9f4ed\" stroke-width=\"5.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n          <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 16 16\"><circle cx=\"8\" cy=\"8\" r=\"8\" fill=\"#c67139\"><\u002Fcircle><path d=\"M2.8 8.3h2l1.1-2 1.8 4.4 5.3-6\" fill=\"none\" stroke=\"#f9f4ed\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n        <\u002Fdiv>\n        <p style=\"margin: 0; font-size: 14px; color: var(--color-neutral-800);\">One heartbeat that settles into a check mark: the tool listens, then confirms. Two ideas in one stroke, and it survives 16 px because the check carries it.<\u002Fp>\n v style=\"display: flex; flex-direction: column; gap: 10px; max-width: 640px; margin-top: 32px;\">\n      <h2 style=\"margin: 0;\">Refined: Pulse-check<\u002Fh2>\n      <p style=\"margin: 0; color: var(--color-neutral-800);\">A terracotta disc with a single round-capped stroke. The wordmark is set in Caprasimo, lowercase, with the hyphen in the accent so it reads as one name. A separate 16 px drawing has a heavier stroke and a smaller pulse.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 20px;\">\n      <div style=\"display: flex; align-items: center; justify-content: center; gap: 18px; min-height: 220px; border-radius: 32px; background: #f9f4ed;\">\n        <svg width=\"64\" height=\"64\" sc-camel-view-box=\"0 0 64 64\"><circle cx=\"32\" cy=\"32\" r=\"32\" fill=\"#c67139\"><\u002Fcircle><path d=\"M11 33h9l4.5-8 7 17L52 19\" fill=\"none\" stroke=\"#f9f4ed\" stroke-width=\"5.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n        <span style=\"white-space: nowrap; font-family: var(--font-heading); font-size: 48px; letter-spacing: -0.01em;\">mn<span style=\"color: #c67139;\">-<\u002Fspan>doctor<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display: flex; align-items: center; justify-content: center; gap: 18px; min-height: 220px; border-radius: 32px; background: #1c1a17; color: #eee7db;\">\n        <svg width=\"64\" height=\"64\" sc-camel-view-box=\"0 0 64 64\"><circle cx=\"32\" cy=\"32\" r=\"32\" fill=\"#c67139\"><\u002Fcircle><path d=\"M11 33h9l4.5-8 7 17L52 19\" fill=\"none\" stroke=\"#f9f4ed\" stroke-width=\"5.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n        <span style=\"white-space: nowrap; font-family: var(--font-heading); font-size: 48px; letter-spacing: -0.01em;\">mn<span style=\"color: #f6a06b;\">-<\u002Fspan>doctor<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display: flex; align-items: center; justif v><strong style=\"color: var(--color-text);\">Don't<\u002Fstrong> add gradients, glows or shadows to the mark.<\u002Fdiv>\n      <div><strong style=\"color: var(--color-text);\">Don't<\u002Fstrong> rotate it, outline it or put it in a hexagon.<\u002Fdiv>\n      <div><strong style=\"color: var(--color-text);\">Don't<\u002Fstrong> recolour the stroke in status colours. The mark is never \"red\".<\u002Fdiv>\n      <div><strong style=\"color: var(--color-text);\">In terminals<\u002Fstrong> there is no glyph: the name prints as <span style=\"font-family: 'JetBrains Mono', monospace; color: #8c491a; font-weight: 700;\">mn-doctor<\u002Fspan> in bold accent.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"colour\" style=\"display: flex; flex-direction: column; gap: 40px;\">\n    <div style=\"display: flex; flex-direction: column; gap: 10px; max-width: 640px;\">\n      <span style=\"font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent-700);\">02 · Colour<\u002Fspan>\n      <h2 style=\"margin: 0;\">Mostly paper and ink<\u002Fh2>\n      <p style=\"margin: 0; color: var(--color-neutral-800);\">Warm neutrals do the work. Terracotta is the only brand accent. Sage, ochre and brick are reserved for status and never used decoratively.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px;\">\n      <div style=\"display: flex; flex-direction: column; gap: 8px;\"><div style=\"height: 96px; border-radius: 24px; background: #f9f4ed; box-shadow: inset 0 0 0 1px #dcd3c4;\"><\u002Fdiv><div style=\"font-size: 14px; font-weight: 600;\">Paper raised<\u002Fdiv><div style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--color-neutral-700);\">#f9f4ed<\u002Fdiv><\u002Fdiv>\n      <div style=\"display: flex; flex-direction: column; gap: 8px;\"><div style=\"height: 96px; border-radius: 24px; background: #f5ead8; box-shadow: inset 0 0 0 1px #dcd3c4;\"><\u002Fdiv><div style=\"font-size: 14px; font-weight: 600;\">Paper<\u002Fdiv><div style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--color-neutral-700);\">#f5ead8<\u002Fdiv><\u002Fdiv>\n      <div style=\"display: flex; flex-direction: column; gap: 8px;\"><div style=\"height: 96px; border-radius: 24px; background: #ebddc5;\"><\u002Fdiv><div style=\"font-size: 14px; font-weight: 600;\">Sand<\u002Fdiv><div style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--color-neutral-700);\">#ebddc5<\u002Fdiv><\u002Fdiv>\n      <div style=\"display: flex; flex-direction: column; gap: 8px;\"><div style=\"height: 96px; border-radius: 24px; background: #dcd3c4;\"><\u002Fdiv><div style=\"font-size: 14px; font-weight: 600;\">Line<\u002Fdiv><div style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--color-neutral-700);\">#dcd3c4<\u002Fdiv><\u002Fdiv>\n      <div style=\"display: flex; flex-direction: column; gap: 8px;\"><div style=\"height: 96px; border-radius: 24px; background: #645c50;\"><\u002Fdiv><div style=\"font-size: 14px; font-weight: 600;\">Ink muted<\u002Fdiv><div style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--color-neutral-700);\">#645c50<\u002Fdiv><\u002Fdiv>\n      <div style=\"display: flex; flex-direction: column; gap: 8px;\"><div style=\"height: 96px; border-radius: 24px; background: #201e1d;\"><\u002Fdiv><div style=\"font-size: 14px; font-weight: 600;\">Ink<\u002Fdiv><div style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--color-neutral-700);\">#201e1d<\u002Fdiv><\u002Fdiv>\n      <div style=\"display: flex; flex-direction: column; gap: 8px;\"><div style=\"height: 96px; border-radius: 24px; background: #1c1a17;\"><\u002Fdiv><div style=\"font-size: 14px; font-weight: 600;\">Night (dark ground)<\u002Fdiv><div style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--color-neutral-700);\">#1c1a17<\u00 ono', monospace;\">#f6a06b · 8.40 AAA<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 8px; border-bottom: 1px solid #eee7db;\">Mark, fills, 24 px+ type<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <sc-raw-tr><sc-raw-td style=\"padding: 10px 8px; border-bottom: 1px solid #eee7db;\">Accent text<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 8px; border-bottom: 1px solid #eee7db; font-family: 'JetBrains Mono', monospace;\">#8c491a · 5.72 AA<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 8px; border-bottom: 1px solid #eee7db; font-family: 'JetBrains Mono', monospace;\">#f6a06b · 8.40 AAA<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 8px; border-bottom: 1px solid #eee7db;\">Links, inline accent text<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <sc-raw-tr><sc-raw-td style=\"padding: 10px 8px; border-bottom: 1px solid #eee7db;\">Healthy<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 8px; border-bottom: 1px solid #eee7db; font-family: 'JetBrains Mono', monospace;\">#4f6a3a · 5.11 AA<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 8px; border-bottom: 1px solid #eee7db; font-family: 'JetBrains Mono', monospace;\">#aebf92 · 8.82 AAA<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 8px; border-bottom: 1px solid #eee7db;\">On its tint: 5.01<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <sc-raw-tr><sc-raw-td style=\"padding: 10px 8px; border-bottom: 1px solid #eee7db;\">Warning<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 8px; border-bottom: 1px solid #eee7db; font-family: 'JetBrains Mono', monospace;\">#7d5a00 · 5.29 AA<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 8px; border-bottom: 1px solid #eee7db; font-family: 'JetBrains Mono', monospace;\">#e5c060 · 9.95 AAA<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 8px; border-bottom: 1px solid #eee7db;\">On its tint: 5.13<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <sc-raw-tr><sc-raw-td style=\"padding: 10px 8px;\">Conflict<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 8px; font-family: 'JetBrains Mono', monospace;\">#a8322a · 5.59 AA<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 8px; font-family: 'JetBrains Mono', monospace;\">#f28b7d · 7.25 AAA<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 8px;\">On its tint: 5.17<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <\u002Fsc-raw-tbody>\n      <\u002Fsc-raw-table>\n    <\u002Fdiv>\n    <p style=\"margin: 0; font-size: 14px; color: var(--color-neutral-800); max-width: 720px;\">Terminal colours are the user's theme, not ours. The CLI emits the 16 standard ANSI colours (green, yellow, red, dim, bold) so it inherits whatever palette someone has tuned; the hexes above are what we use in screenshots, docs and the site. Status is never carried by colour alone: every line has a symbol and a word.<\u002Fp>\n  <\u002Fsection>\n\n  <section id=\"type\" style=\"display: flex; flex-direction: column; gap: 40px;\">\n    <div style=\"display: flex; flex-direction: column; gap: 10px; max-width: 640px;\">\n      <span style=\"font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent-700);\">03 · Typography<\u002Fspan>\n      <h2 style=\"margin: 0;\">Figtree for words, JetBrains Mono for code<\u002Fh2>\n      <p style=\"margin: 0; color: var(--color-neutral-800);\">Both are free under the SIL Open Font License. Caprasimo is reserved for the wordmark and page-level headlines: a little warmth on top, never in UI or body text.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px;\">\n      <div style=\"display: flex; flex-direction: column; gap: 14px; padding: 28px; border-radius: 32px; background: var(--color-surface);\"><span style=\"font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-neutral-700);\">Display · Caprasimo 400<\u002Fspan><span style=\"font-family: var(--font-heading); font-size: 56px; line-height: 1;\">Aa<\u002Fspan><span style=\"font-size: 14px; color: var(--color-neutral-800);\">Wordmark, H1–H3 on the site, deck titles.<\u002Fspan><\u002Fdiv>\n      <div style=\"display: flex; flex-direction: column; gap: 14px; padding: 28px; border-radius: 32px; background: var(--color-surface);\"><span style=\"font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-neutral-700);\">Sans · Figtree 400 / 600 / 700<\u002Fspan><span style=\"font-family: Figtree, sans-serif; font-weight: 600; font-size: 56px; line-height: 1;\">Aa<\u002Fspan><span style=\"font-size: 14px; color: var(--color-neutral-800);\">UI, docs body, H4 and below, labels, README prose.<\u002Fspan><\u002Fdiv>\n      <div style=\"display: flex; flex-direction: column; gap: 14px; padding: 28px; border-radius: 32px; background: var(--color-surface);\"><span style=\"font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-neutral-700);\">Mono · JetBrains Mono 400 / 700<\u002Fspan><span style=\"font-family: 'JetBrains Mono', monospace; font-size: 48px; line-height: 1.15;\">0.24.0<\u002Fspan><span style=\"font-size: 14px; color: var(--color-neutral-800);\">Code, versions, commands, terminal screenshots. Clear 0/O and 1/l/I; full box-drawing set.<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display: flex; flex-direction: column; border-radius: 32px; background: #f9f4ed; padding: 12px 28px;\">\n      <div style=\"display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 20px; align-items: baseline; padding: 18px 0; border-bottom: 1px solid #eee7db;\"><span style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--color-neutral-700);\">Display · 64/1.05<\u002Fspan><span style=\"font-family: var(--font-heading); font-size: 64px; line-height: 1.05;\">Matching versions.<\u002Fspan><\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 20px; align-items: baseline; padding: 18px 0; border-bottom: 1px solid #eee7db;\"><span style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--color-neutral-700);\">H1 · 42/1.12<\u002Fspan><span style=\"font-family: var(--font-heading); font-size: 42px; line-height: 1.12;\">Install mn-doctor<\u002Fspan><\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 20px; align-items: baseline; padding: 18px 0; border-bottom: 1px solid #eee7db;\"><span style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--color-neutral-700);\">H2 · 32/1.12<\u002Fspan><span style=\"font-family: var(--font-heading); font-size: 32px; line-height: 1.12;\">The GitHub Action<\u002Fspan><\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 20px; align-items: baseline; padding: 18px 0; border-bottom: 1px solid #eee7db;\"><span style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--color-neutral-700);\">H3 · 25/1.2<\u002Fspan><span style=\"font-family: var(--font-heading); font-size: 25px; line-height: 1.2;\">Configuration<\u002Fspan><\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 20px; align-items: baseline; padding: 18px 0; border-bottom: 1px solid #eee7db;\"><span style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--color-neutral-700);\">H4 · Figtree 700 20<\u002Fspan><span style=\"font-weight: 700; font-size: 20px;\">--strict flag<\u002Fspan><\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 20px; align-items: baseline; padding: 18px 0; border-bottom: 1px solid #eee7db;\"><span style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--color-neutral-700);\">Body · 16/1.6<\u002Fspan><span style=\"font-size: 16px; line-height: 1.6; max-width: 60ch;\">mn-doctor reads your package.json, lockfile and docker-compose.yml, then compares every version against the compatibility matrix for your network.<\u002Fspan><\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 20px; align-items: baseline; padding: 18px 0; border-bottom: 1px solid #eee7db;\"><span style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--color-neutral-700);\">Small · 13/1.5<\u002Fspan><span style=\"font-size: 13px; color: var(--color-neutral-800);\">Last updated against compact 0.24.0<\u002Fspan><\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 20px; align-items: baseline; padding: 18px 0;\"><span style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--color-neutral-700);\">Code · Mono 14/1.6<\u002Fspan><span style=\"font-family: 'JetBrains Mono', monospace; font-size: 14px;\">npx mn-doctor check --network testnet<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"terminal\" style=\"display: flex; flex-direction: column; gap: 40px;\">\n    <div style=\"display: flex; flex-direction: column; gap: 10px; max-width: 680px;\">\n      <span style=\"font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent-700);\">04 · Terminal<\u002Fspan>\n      <h2 style=\"margin: 0;\">The product is the output<\u002Fh2>\n      <p style=\"margin: 0; color: var(--color-neutral-800);\">Every screen follows one order: header, component list, one explanation per problem, a summary, the next step. Lines stay under 80 columns. Sample versions shown are illustrative.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 520px), 1fr)); gap: 28px; align-items: start;\">\n      <div style=\"display: flex; flex-direction: column; gap: 12px;\"><span style=\"font-weight: 600;\">mn-doctor check · dark terminal<\u002Fspan><dc-import name=\"Terminal\" theme=\"dark\" screen=\"check\" hint-size=\"100%,720px\"><\u002Fdc-import><\u002Fdiv>\n      <div style=\"display: flex; flex-direction: column; gap: 12px;\"><span style=\"font-weight: 600;\">mn-doctor check · light terminal<\u002Fspan><dc-import name=\"Terminal\" theme=\"light\" screen=\"check\" hint-size=\"100%,720px\"><\u002Fdc-import><\u002Fdiv>\n      <div style=\"display: flex; flex-direction: column; gap: 12px;\"><span style=\"font-weight: 600;\">mn-doctor fix · diff, confirm, apply<\u002Fspan><dc-import name=\"Terminal\" theme=\"dark\" screen=\"fix\" hint-size=\"100%,680px\"><\u002Fdc-import><\u002Fdiv>\n      <div style=\"display: flex; flex-direction: column; gap: 28px;\">\n        <div style=\"display: flex; flex-direction: column; gap: 12px;\"><span style=\"font-weight: 600;\">All healthy<\u002Fspan><dc-import name=\"Terminal\" theme=\"light\" screen=\"healthy\" hint-size=\"100%,380px\"><\u002Fdc-import><\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 12px;\"><span style=\"font-weight: 600;\">NO_COLOR=1 · still readable<\u002Fspan><dc-import name=\"Terminal\" theme=\"mono\" screen=\"healthy\" title=\"NO_COLOR=1\" hint-size=\"100%,380px\"><\u002Fdc-import><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"overflow-x: auto; border-radius: 28px; background: #f9f4ed; padding: 8px 20px;\">\n      <sc-raw-table style=\"width: 100%; border-collapse: collapse; font-size: 14px; min-width: 640px;\">\n        <sc-raw-thead><sc-raw-tr style=\"text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-neutral-700);\"><sc-raw-th style=\"padding: 12px 8px; border-bottom: 1px solid #dcd3c4;\">Symbol<\u002Fsc-raw-th><sc-raw-th style=\"padding: 12px 8px; border-bottom: 1px solid #dcd3c4;\">Word<\u002Fsc-raw-th><sc-raw-th style=\"padding: 12px 8px; border-bottom: 1px solid #dcd3c4;\">ANSI<\u002Fsc-raw-th><sc-raw-th style=\"padding: 12px 8px; border-bottom: 1px solid #dcd3c4;\">ASCII fallback<\u002Fsc-raw-th><sc-raw-th style=\"padding: 12px 8px; border-bottom: 1px solid #dcd3c4;\">Meaning<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n        <sc-raw-tbody>\n          <sc-raw-tr><sc-raw-td style=\"padding: 10px 8px; border-bottom: 1px solid #eee7db; font-family: 'JetBrains Mono', monospace; color: #4f6a3a; font-size: 18px;\">✓<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 8px; border-bottom: 1px solid #eee7db; font-family: 'JetBrains Mono', monospace;\">ok<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 8px; border-bottom: 1px solid #eee7db; font-family: 'JetBrains Mono', monospace;\">32 green<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 8px; border-bottom: 1px solid #eee7db; font-family: 'JetBrains Mono', monospace;\">[ok]<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 8px; border-bottom: 1px solid #eee7db;\">Matches the expected version<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <sc-raw-tr><sc-raw-td style=\"padding: 10px 8px; border-bottom: 1px solid #eee7db; font-family: 'JetBrains Mono', monospace; color: #7d5a00; font-size: 18px; font-weight: 700;\">!<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 8px; border-bottom: 1px solid #eee7db; font-family: 'JetBrains Mono', monospace;\">warn<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 8px; border-bottom: 1px solid #eee7db; font-family: 'JetBrains Mono', monospace;\">33 yellow<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 8px; border-bottom: 1px solid #eee7db; font-family: 'JetBrains Mono', monospace;\">[warn]<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 8px; border-bottom: 1px solid #eee7db;\">Drifted but compatible. Exit 0 unless --strict<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <sc-raw-tr><sc-raw-td style=\"padding: 10px 8px; border-bottom: 1px solid #eee7db; font-family: 'JetBrains Mono', monospace; color: #a8322a; font-size: 18px; font-weight: 700;\">✗<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 8px; border-bottom: 1px solid #eee7db; font-family: 'JetBrains Mono', monospace;\">conflict<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 8px; border-bottom: 1px solid #eee7db; font-family: 'JetBrains Mono', monospace;\">31 red + bold<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 8px; border-bottom: 1px solid #eee7db; font-family: 'JetBrains Mono', monospace;\">[x]<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 8px; border-bottom: 1px solid #eee7db;\">Will break compile or deploy. Exit 1<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <sc-raw-tr><sc-raw-td style=\"padding: 10px 8px; font-family: 'JetBrains Mono', monospace; font-size: 18px;\">─ │ ┌ └<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 8px; font-family: 'JetBrains Mono', monospace;\">rules<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 8px; font-family: 'JetBrains Mono', monospace;\">2 dim<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 8px; font-family: 'JetBrains Mono', monospace;\">- | + +<\u002Fsc-raw-td><sc-raw-td style=\"padding: 10px 8px;\">Structure only, never meaning<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <\u002Fsc-raw-tbody>\n      <\u002Fsc-raw-table>\n    <\u002Fdiv>\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px 32px; font-size: 14px; color: var(--color-neutral-800);\">\n      <div><strong style=\"color: var(--color-text);\">Colour off<\u002Fstrong> when NO_COLOR is set, with --no-color, or when output isn't a TTY.<\u002Fdiv>\n      <div><strong style=\"color: var(--color-text);\">ASCII mode<\u002Fstrong> when the locale isn't UTF-8, or with --ascii.<\u002Fdiv>\n      <div><strong style=\"color: var(--color-text);\">--json<\u002Fstrong> prints the same findings for CI and editors. No colour, no prose.<\u002Fdiv>\n      <div><strong style=\"color: var(--color-text);\">fix<\u002Fstrong> never writes without a diff and a [y/N] prompt. --yes is for CI only.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"readme\" style=\"display: flex; flex-direction: column; gap: 40px;\">\n    <div style=\"display: flex; flex-direction: column; gap: 10px; max-width: 640px;\">\n      <span style=\"font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent-700);\">05 · README<\u002Fspan>\n      <h2 style=\"margin: 0;\">Banner, badges, first screen<\u002Fh2>\n      <p style=\"margin: 0; color: var(--color-neutral-800);\">Shown at 50%. Open <a href=\"Social Preview.dc.html\">Social Preview<\u002Fa> (1280×640) and <a href=\"README Banner.dc.html\">README Banner<\u002Fa> (1280×320) at full size to export PNGs.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display: flex; flex-wrap: wrap; gap: 28px; align-items: flex-start;\">\n      <div style=\"display: flex; flex-direction: column; gap: 10px;\"><span style=\"font-weight: 600;\">Social preview · 1280×640<\u002Fspan><div style=\"width: 640px; max-width: 100%; height: 320px; overflow: hidden; border-radius: 16px; box-shadow: var(--shadow-md);\"><div style=\"zoom: 0.5;\"><dc-import name=\"Social Preview\" hint-size=\"1280px,640px\"><\u002Fdc-import><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div style=\"display: flex; flex-direction: column; gap: 10px;\"><span style=\"font-weight: 600;\">Inline banner · 1280×320<\u002Fspan><div style=\"width: 640px; max-width: 100%; height: 160px; overflow: hidden; border-radius: 14px;\"><div style=\"zoom: 0.5;\"><dc-import name=\"README Banner\" hint-size=\"1280px,320px\"><\u002Fdc-import><\u002Fdiv><\u002Fdiv>\n        <span style=\"font-weight: 600; margin-top: 18px;\">Badges · shields.io flat-square<\u002Fspan>\n        <div style=\"display: flex; gap: 8px; flex-wrap: wrap; font-family: Verdana, sans-serif; font-size: 11px; color: #fff;\">\n          <span style=\"display: inline-flex;\"><span style=\"background: #201e1d; padding: 3px 7px;\">npm<\u002Fspan><span style=\"background: #c67139; color: #201e1d; padding: 3px 7px;\">v0.4.2<\u002Fspan><\u002Fspan>\n          <span style=\"display: inline-flex;\"><span style=\"background: #201e1d; padding: 3px 7px;\">ci<\u002Fspan><span style=\"background: #4f6a3a; padding: 3px 7px;\">passing<\u002Fspan><\u002Fspan>\n          <span style=\"display: inline-flex;\"><span style=\"background: #201e1d; padding: 3px 7px;\">licence<\u002Fspan><span style=\"background: #645c50; padding: 3px 7px;\">Apache-2.0<\u002Fspan><\u002Fspan>\n        <\u002Fdiv>\n        <span style=\"font-size: 13px; color: var(--color-neutral-800); max-width: 600px;\">Three badges at most: version, CI, licence. Label always ink; value in accent, healthy or muted. URLs are in README-top.md.<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"max-width: 820px; border-radius: 16px; background: #ffffff; box-shadow: 0 0 0 1px #dcd3c4; padding: 32px; display: flex; flex-direction: column; gap: 16px; font-family: -apple-system, 'Segoe UI', sans-serif; color: #1f2328;\">\n      <span style=\"font-size: 12px; color: #645c50; font-family: Figtree, sans-serif;\">README.md · top of page<\u002Fspan>\n      <div style=\"overflow: hidden; border-radius: 12px; aspect-ratio: 4 / 1;\"><div style=\"zoom: 0.594;\"><dc-import name=\"README Banner\" hint-size=\"1280px,320px\"><\u002Fdc-import><\u002Fdiv><\u002Fdiv>\n      <div style=\"display: flex; gap: 6px; justify-content: center; font-family: Verdana, sans-serif; font-size: 11px; color: #fff;\">\n        <span style=\"display: inline-flex;\"><span style=\"background: #201e1d; padding: 3px 7px;\">npm<\u002Fspan><span style=\"background: #c67139; color: #201e1d; padding: 3px 7px;\">v0.4.2<\u002Fspan><\u002Fspan>\n        <span style=\"display: inline-flex;\"><span style=\"background: #201e1d; padding: 3px 7px;\">ci<\u002Fspan><span style=\"background: #4f6a3a; padding: 3px 7px;\">passing<\u002Fspan><\u002Fspan>\n        <span style=\"display: inline-flex;\"><span style=\"background: #201e1d; padding: 3px 7px;\">licence<\u002Fspan><span style=\"background: #645c50; padding: 3px 7px;\">Apache-2.0<\u002Fspan><\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"font-size: 30px; font-weight: 600; padding-bottom: 8px; border-bottom: 1px solid #d1d9e0;\">mn-doctor<\u002Fdiv>\n      <p style=\"margin: 0; font-size: 16px; line-height: 1.5;\">Checks that your Midnight compiler, runtime packages and proof server are on matching versions, explains any mismatch in plain English, and fixes it after showing you the diff.<\u002Fp>\n      <div style=\"background: #f6f8fa; border-radius: 6px; padding: 14px 16px; font-family: 'JetBrains Mono', monospace; font-size: 14px;\">npx mn-doctor<\u002Fdiv>\n      <div style=\"display: flex; align-items: center; justify-content: center; height: 120px; border-radius: 8px; background: #f6f8fa; color: #645c50; font-size: 13px; font-family: Figtree, sans-serif;\">terminal-check.png · screenshot of the check output, 720 px wide<\u002Fdiv>\n      <ul style=\"margin: 0; padding-left: 22px; font-size: 16px; line-height: 1.7;\"><li><strong>Check<\u002Fstrong> · one command, about a second, no config.<\u002Fli><li><strong>Explain<\u002Fstrong> · every mismatch says what broke, why, and the exact fix.<\u002Fli><li><strong>Fix<\u002Fstrong> · <code style=\"font-family: 'JetBrains Mono', monospace; font-size: 14px; background: #f6f8fa; padding: 2px 5px; border-radius: 4px;\">mn-doctor fix<\u002Fcode> shows a diff, backs up, then applies. Undo any time.<\u002Fli><\u002Ful>\n      <p style=\"margin: 0; font-size: 14px; color: #59636e;\">Install · Usage · GitHub Action · How it works · Contributing<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"site\" style=\"display: flex; flex-direction: column; gap: 32px;\">\n    <div style=\"display: flex; flex-direction: column; gap: 10px; max-width: 640px;\">\n      <span style=\"font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent-700);\">06 · Site &amp; deck<\u002Fspan>\n      <h2 style=\"margin: 0;\">Landing page and pitch deck<\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px;\">\n      <a href=\"Landing.dc.html\" style=\"display: flex; flex-direction: column; gap: 10px; padding: 32px; border-radius: 32px; background: var(--color-surface); color: inherit; text-decoration: none;\"><span style=\"font-family: var(--font-heading); font-size: 28px;\">Landing &amp; docs page →<\u002Fspan><span style=\"color: var(--color-neutral-800);\">Promise, one terminal demo, one-line install, three benefits, the GitHub Action, footer.<\u002Fspan><\u002Fa>\n      <a href=\"Pitch Deck.dc.html\" style=\"display: flex; flex-direction: column; gap: 10px; padding: 32px; border-radius: 32px; background: var(--color-surface); color: inherit; text-decoration: none;\"><span style=\"font-family: var(--font-heading); font-size: 28px;\">Hackathon pitch deck →<\u002Fspan><span style=\"color: var(--color-neutral-800);\">Eight slides at 1920×1080. Numbers on slide 3 are placeholders for your own data.<\u002Fspan><\u002Fa>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"voice\" style=\"display: flex; flex-direction: column; gap: 40px;\">\n    <div style=\"display: flex; flex-direction: column; gap: 10px; max-width: 680px;\">\n      <span style=\"font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent-700);\">07 · Voice<\u002Fspan>\n      <h2 style=\"margin: 0;\">Good bedside manner<\u002Fh2>\n      <p style=\"margin: 0; color: var(--color-neutral-800);\">Say what's wrong, why, and the exact fix, in that order. Use plain words and real numbers. Assume the reader is smart and tired. A little wit is allowed once things are fixed, never while they're broken.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display: flex; flex-direction: column; gap: 12px;\">\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px;\">\n        <div style=\"padding: 20px 24px; border-radius: 24px; background: #f8ddd6; display: flex; flex-direction: column; gap: 6px;\"><span style=\"font-size: 12px; font-weight: 700; color: #a8322a;\">✗ DON'T<\u002Fspan><span style=\"font-family: 'JetBrains Mono', monospace; font-size: 14px;\">FATAL: Incompatible proof server detected!<\u002Fspan><\u002Fdiv>\n        <div style=\"padding: 20px 24px; border-radius: 24px; background: #e1eecc; display: flex; flex-direction: column; gap: 6px;\"><span style=\"font-size: 12px; font-weight: 700; color: #4f6a3a;\">✓ DO<\u002Fspan><span style=\"font-family: 'JetBrains Mono', monospace; font-size: 14px;\">Proof server 3.0.7 can't read proofs from compiler 0.24.0. Update it to 4.0.0.<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px;\">\n        <div style=\"padding: 20px 24px; border-radius: 24px; background: #f8ddd6; display: flex; flex-direction: column; gap: 6px;\"><span style=\"font-size: 12px; font-weight: 700; color: #a8322a;\">✗ DON'T<\u002Fspan><span style=\"font-size: 15px;\">You installed the wrong version of the runtime.<\u002Fspan><\u002Fdiv>\n        <div style=\"padding: 20px 24px; border-radius: 24px; background: #e1eecc; display: flex; flex-direction: column; gap: 6px;\"><span style=\"font-size: 12px; font-weight: 700; color: #4f6a3a;\">✓ DO<\u002Fspan><span style=\"font-size: 15px;\">compact-runtime 0.8.1 doesn't match compiler 0.24.0. This happens after most compiler updates.<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px;\">\n        <div style=\"padding: 20px 24px; border-radius: 24px; background: #f8ddd6; display: flex; flex-direction: column; gap: 6px;\"><span style=\"font-size: 12px; font-weight: 700; color: #a8322a;\">✗ DON'T<\u002Fspan><span style=\"font-size: 15px;\">Revolutionary next-gen toolchain management that empowers Web3 builders.<\u002Fspan><\u002Fdiv>\n        <div style=\"padding: 20px 24px; border-radius: 24px; background: #e1eecc; display: flex; flex-direction: column; gap: 6px;\"><span style=\"font-size: 12px; font-weight: 700; color: #4f6a3a;\">✓ DO<\u002Fspa
